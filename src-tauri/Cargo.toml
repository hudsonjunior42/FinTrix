[package]
name = "fintrix"
version.workspace = true
edition.workspace = true
license.workspace = true

# o Android carrega a casca como biblioteca (cdylib); o desktop usa o main.rs
[lib]
name = "fintrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
fintrix-core = { path = "../crates/fintrix-core" }
tauri-plugin-dialog = "2"
# grava o arquivo escolhido no "Salvar como": caminho no desktop, content:// no Android (a interface não tem acesso)
tauri-plugin-fs = "2"
# sincronização em segundo plano
tokio = { version = "1", features = ["time", "sync", "macros"] }

# QR code do código de pareamento
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# leitor de QR code (câmera) para parear o celular
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# chave do banco no chaveiro do sistema (Secret Service no Linux, Keychain, Credential Manager); no celular, outro caminho
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# nome do programa no GTK = app_id no Wayland, que o KDE e o GNOME usam para achar o ícone (.desktop)
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

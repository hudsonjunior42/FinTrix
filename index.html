<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FinTrix: controle financeiro pessoal com contas, cartões, faturas, orçamento e relatórios.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>FinTrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral fixa + área de trabalho com o mês no topo; no celular, abas embaixo e botão + flutuante. Valores em fonte mono, como num livro-caixa. */
:root{
  color-scheme:dark;
  --bg:#0E1117; --surface:#161B22; --surface-2:#1C222C; --surface-3:#252C38; --line:#2A3240; --line-2:#3A4352;
  --fg:#E6EDF3; --muted:#8B95A5; --faint:#6B7688;
  --accent:#7B8CFF; --on-accent:#0B0E14; --accent-soft:rgba(123,140,255,.15);
  --pos:#34D399; --neg:#F87171; --tr:#60A5FA; --warn:#FBBF24; --cc:#C084FC;
  --pos-soft:rgba(52,211,153,.13); --neg-soft:rgba(248,113,113,.13); --tr-soft:rgba(96,165,250,.13); --warn-soft:rgba(251,191,36,.13); --cc-soft:rgba(192,132,252,.13);
  --shadow:0 20px 60px rgba(0,0,0,.55);
  --font-d:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-b:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-m:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:10px;
  --lg1a:#C9D0FF; --lg1b:#9AA7FF; --lg2a:#7B8CFF; --lg2b:#5E6FEA; --lg3a:#5A6BEA; --lg3b:#3F50C9;
}
/* Tema: escuro é o padrão. Claro quando escolhido em Configurações; "automático" segue o claude.ai ou o sistema. */
:root[data-tema="claro"],:root[data-tema="auto"][data-theme="light"]{
  color-scheme:light;
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F6F7FA; --surface-3:#EBEDF2; --line:#E0E3E9; --line-2:#C9CED8;
  --fg:#141922; --muted:#566070; --faint:#7A8494;
  --accent:#4F5BD5; --on-accent:#FFFFFF; --accent-soft:rgba(79,91,213,.10);
  --pos:#047857; --neg:#C62828; --tr:#1D5FD1; --warn:#9A5600; --cc:#8B3FD9;
  --pos-soft:rgba(4,120,87,.09); --neg-soft:rgba(198,40,40,.08); --tr-soft:rgba(29,95,209,.08); --warn-soft:rgba(154,86,0,.09); --cc-soft:rgba(139,63,217,.09);
  --shadow:0 20px 60px rgba(20,25,34,.20);
  --lg1a:#A6AFF6; --lg1b:#7E89EC; --lg2a:#5C68DE; --lg2b:#4651C8; --lg3a:#3D48B8; --lg3b:#2E378F;
  --seg-on:#FFFFFF; --seg-sh:0 1px 3px rgba(20,25,34,.14);
}
@media (prefers-color-scheme: light){:root[data-tema="auto"]:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F6F7FA; --surface-3:#EBEDF2; --line:#E0E3E9; --line-2:#C9CED8;
  --fg:#141922; --muted:#566070; --faint:#7A8494;
  --accent:#4F5BD5; --on-accent:#FFFFFF; --accent-soft:rgba(79,91,213,.10);
  --pos:#047857; --neg:#C62828; --tr:#1D5FD1; --warn:#9A5600; --cc:#8B3FD9;
  --pos-soft:rgba(4,120,87,.09); --neg-soft:rgba(198,40,40,.08); --tr-soft:rgba(29,95,209,.08); --warn-soft:rgba(154,86,0,.09); --cc-soft:rgba(139,63,217,.09);
  --shadow:0 20px 60px rgba(20,25,34,.20);
  --lg1a:#A6AFF6; --lg1b:#7E89EC; --lg2a:#5C68DE; --lg2b:#4651C8; --lg3a:#3D48B8; --lg3b:#2E378F;
  --seg-on:#FFFFFF; --seg-sh:0 1px 3px rgba(20,25,34,.14);
}}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)}.neg{color:var(--neg)}.trc{color:var(--tr)}.ccc{color:var(--cc)}.muted{color:var(--muted)}.warn{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* estrutura */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 18px}
.brand-logo{width:34px;height:36px;flex:none;filter:drop-shadow(0 1px 1.2px rgba(8,10,30,.35))}
.logo-m{display:none;width:24px;height:26px;flex:none;filter:drop-shadow(0 1px 1px rgba(8,10,30,.3))}
.brand b{font-family:var(--font-d);font-size:23px;font-weight:650;letter-spacing:-.015em;line-height:1}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--muted);text-align:left;font-weight:500}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--fg)}
.nav svg{width:18px;height:18px;flex:none}
.side-sep{height:1px;background:var(--line);margin:10px 6px}
.side-foot{margin-top:auto;padding:10px;color:var(--faint);font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.top h1{font-family:var(--font-d);font-size:22px;font-weight:650;letter-spacing:-.015em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:none;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.monthnav button:hover{background:var(--surface-3);color:var(--fg)}
.monthnav .ml{min-width:132px;text-align:center;font-weight:600;font-size:13.5px;text-transform:capitalize;padding:0 4px}
.content{flex:1;overflow:auto;padding:22px 24px 110px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent);background:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-3);color:var(--fg)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[disabled]{opacity:.28;cursor:default;background:none}
.ordrow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-top:1px solid var(--line);min-width:0}
.ordrow:first-child{border-top:0}
.ordrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ordrow.sub{padding-left:26px}
.ordrow.sub .nm{color:var(--muted)}

/* painéis */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.panel-h h2{font-family:var(--font-d);font-size:16px;font-weight:620;margin:0;flex:1;letter-spacing:-.01em}
.kpi{padding:16px 18px}
.kpi .lab{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;letter-spacing:-.03em;margin-top:6px;white-space:nowrap}
.kpi .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.kpi .sub .num{white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{font-family:var(--font-m);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.clickable{cursor:pointer;border-radius:8px}
.clickable:hover{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.late{background:var(--neg-soft);color:var(--neg)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.cc{background:var(--cc-soft);color:var(--cc)}
.pill.mute{background:var(--surface-3);color:var(--muted)}
.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.over>i{background:var(--warn)}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}
.tag{display:inline-block;padding:0 6px;border-radius:5px;background:var(--surface-3);color:var(--muted);font-size:11.5px;margin-left:4px}

/* lançamentos */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.chip{border:0;background:none;padding:5px 12px;border-radius:999px;color:var(--muted);font-weight:500;font-size:13px}
.chip.on{background:var(--surface-3);color:var(--fg)}
.field-sm{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;max-width:100%}
.search{flex:1 1 200px}
.day{display:flex;justify-content:space-between;padding:14px 4px 6px;color:var(--muted);font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line)}
.day span:first-child::first-letter{text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);min-width:0}
.row:hover{background:var(--surface-2)}
.row .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.row .grow{flex:1;min-width:0;cursor:pointer}
.row .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--font-m);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:110px;text-align:right}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);background:none;display:grid;place-items:center;flex:none;color:transparent}
.chk:hover{border-color:var(--pos)}
.chk.on{background:var(--pos);border-color:var(--pos);color:var(--on-accent)}
.chk svg{width:14px;height:14px}
.chk-ph{width:26px;flex:none}
.foot-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.foot-sum div{min-width:0}
.foot-sum span{display:block;color:var(--muted);font-size:12px}
.foot-sum b{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-weight:500;font-size:16px;white-space:nowrap}

/* cartões */
.cardtabs{display:flex;gap:8px;flex-wrap:wrap}
.cardtab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;color:var(--muted);font-weight:500}
.cardtab.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.inv-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.inv-head span{display:block;color:var(--muted);font-size:12px}
.inv-head b{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-weight:500;font-size:17px}

/* gráfico */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12.5px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.catbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:12px;align-items:center;padding:7px 0}
.catbar .nm{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-h.ph-g{flex-wrap:wrap;row-gap:8px}
.panel-h.ph-g h2{flex:1 1 auto}
.gsw{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.gsw button{border:0;background:none;width:30px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--faint)}
.gsw button:hover{color:var(--fg)}
.gsw button.on{background:var(--surface-3);color:var(--accent)}
.gsw svg{width:16px;height:16px}
.gwrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.gpie{position:relative;flex:0 0 auto;width:min(196px,100%);margin-inline:auto}
.gpie svg{display:block;width:100%;height:auto;overflow:visible}
.gpie path{transition:opacity .15s,transform .15s;transform-origin:100px 100px;cursor:pointer}
.gctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:0 26%}
.gctr span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gctr b{display:block;font-family:var(--font-m);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.gctr small{display:block;color:var(--muted);font-size:12px;font-family:var(--font-m)}
.gctr .hl-on,.gchart.hov .gctr .hl-off,.gchart.hov .ginfo .hl-off{display:none}
.gchart.hov .gctr .hl-on,.gchart.hov .ginfo .hl-on{display:block}
.ginfo .hl-on{display:none}
.glg{flex:1 1 220px;min-width:0}
.gli{display:grid;grid-template-columns:auto minmax(0,1fr) auto 40px;gap:10px;align-items:center;padding:6px 6px;margin:0 -6px;border-radius:7px;cursor:pointer;transition:opacity .15s,background .15s}
.gli .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gli .pc{text-align:right;color:var(--muted)}
.gchart.hov [data-ci]:not(.hl){opacity:.38}
.gchart.hov .gli.hl{background:var(--surface-2)}
.gchart.hov .gpie path.hl{transform:scale(1.035)}
.gtree{position:relative;height:clamp(220px,34vw,260px)}
.gtb{position:absolute;padding:1.5px;cursor:pointer;transition:opacity .15s}
.gtb .in{width:100%;height:100%;border-radius:8px;background:var(--c);color:#fff;padding:7px 9px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;text-shadow:0 1px 2px rgba(0,0,0,.35);line-height:1.25}
.gtb b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gtb span{font-size:12px;font-family:var(--font-m);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.gtb[data-lv="2"] .vl,.gtb[data-lv="1"] .vl,.gtb[data-lv="0"] .vl,.gtb[data-lv="0"] b,.gtb[data-lv="-1"] .in>*{display:none}
.gtb[data-lv="1"] .in{flex-direction:row;align-items:center;gap:6px;padding:3px 8px}
.gtb[data-lv="1"] b{flex:1 1 auto;font-size:12px}
.gtb[data-lv="0"] .in{align-items:center;justify-content:center;padding:2px}
.gtb[data-lv="0"] .pc{font-size:11px;opacity:1}
.ginfo{margin-top:10px;color:var(--muted);font-size:12.5px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ginfo b{color:var(--fg);font-weight:600}

/* modal */
.mback{position:fixed;inset:0;background:rgba(5,7,10,.62);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:50;overflow:auto}
.modal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.modal.sm{width:min(440px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);border-top:4px solid var(--accent)}
.mhead h3{font-family:var(--font-d);font-size:17px;font-weight:620;margin:0;flex:1}
.mhead.t-despesa{border-top-color:var(--neg)}.mhead.t-receita{border-top-color:var(--pos)}.mhead.t-transf{border-top-color:var(--tr)}.mhead.t-cartao{border-top-color:var(--cc)}
.seg{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:1;min-width:0;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:7px;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--seg-on,var(--surface-3));color:var(--fg);box-shadow:var(--seg-sh,none)}
.seg button.on[data-act="tema"]{color:var(--accent)}
.seg button.on[data-tipo="despesa"]{color:var(--neg)}.seg button.on[data-tipo="receita"]{color:var(--pos)}.seg button.on[data-tipo="transf"]{color:var(--tr)}.seg button.on[data-tipo="cartao"]{color:var(--cc)}
.mbody{padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1 1 auto}
.mfoot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.mfoot .sp{flex:1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.flab{font-size:12.5px;color:var(--muted);font-weight:500}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:60px}
.money{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-size:30px;font-weight:500;letter-spacing:-.03em;padding:10px 12px;text-align:left}
.t-despesa-c .money{color:var(--neg)}.t-receita-c .money{color:var(--pos)}.t-transf-c .money{color:var(--tr)}.t-cartao-c .money{color:var(--cc)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

@media (prefers-reduced-motion:no-preference){

  .onb.anim .pc-l{animation:onbL .75s cubic-bezier(.05,.7,.1,1) .35s both}
  .onb.anim .pc-r{animation:onbR .75s cubic-bezier(.05,.7,.1,1) .5s both}
  .onb.anim .onb-logo-a{animation:onbAssenta .5s cubic-bezier(.2,0,0,1) 1.05s both}
  .onb.anim .onb-brilho{animation:onbBrilho 1.1s cubic-bezier(.2,0,0,1) .9s both}
  .onb.anim .onb-onda{animation:onbOnda 1s cubic-bezier(.2,0,0,1) 1.05s both}
  .onb.anim .onb-t{animation:onbSobe .6s cubic-bezier(.05,.7,.1,1) 1.45s both}
  .onb.anim .onb-s{animation:onbSobe .6s cubic-bezier(.05,.7,.1,1) 1.6s both}

  .onb.anim .onb-acoes>:nth-child(4){animation-delay:2.5s}
  .onb.pular *{animation-delay:0s!important;animation-duration:.01s!important}
  .onb-form:not([hidden]){animation:onbSobe .45s cubic-bezier(.05,.7,.1,1) both}
  .onb[data-passo="intro"].pular .onb-acoes>*{animation:onbSobe .35s cubic-bezier(.05,.7,.1,1) both!important}
}
@keyframes onbMarca{from{transform:translateY(var(--sobe,0))}to{transform:none}}
@keyframes onbT{from{opacity:0;transform:translateY(-38%) scale(.82)}to{opacity:1;transform:none}}
@keyframes onbL{from{opacity:0;transform:translate(-30%,22%) scale(.9)}to{opacity:1;transform:none}}
@keyframes onbR{from{opacity:0;transform:translate(30%,22%) scale(.9)}to{opacity:1;transform:none}}
@keyframes onbAssenta{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes onbBrilho{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes onbOnda{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}15%{opacity:.6}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
@keyframes onbSobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

const catPai = id => { const c = cats()[id]; return c && c.pai ? c.pai : id; };
const catNome = id => { const c = cats()[id]; if (!c) return "Sem categoria"; if (c.pai && cats()[c.pai]) return `${cats()[c.pai].nome} › ${c.nome}`; return c.nome; };
const catCor = id => { const p = cats()[catPai(id)]; return (p && p.cor) || "#7D8B99"; };

const partes = l => Array.isArray(l.div) && l.div.length > 1 ? l.div : [{ cat: l.cat || null, valor: l.valor }];

// soma das partes de um lançamento que caem numa categoria (pai) — "_" = sem categoria

function limpo(l) {

  for (const [k, v] of Object.entries(l)) if (v !== undefined && k !== "virtual" && k !== "_ano") o[k] = v;

/* ============================================================ versões dos dados, backup e restauração
   VERSAO_DADOS é a versão do formato gravado (config.versao). Quando o formato mudar:
     1. suba VERSAO_DADOS;
     2. escreva MIGRACOES[nova versão]: recebe { config, lancamentos } na versão anterior e devolve na nova.
   Cada migração é uma função pura e idempotente (rodar duas vezes dá o mesmo resultado), porque no claude.ai a gravação
   não é atômica e pode ser repetida. A migração roda na abertura do app (com cópia de segurança antes) e ao restaurar
   um backup antigo. Dados de uma versão mais nova que a do app nunca são abertos nem gravados. */
const VERSAO_DADOS = 2;
const MIGRACOES = {
  // v2 (1.1): limite do orçamento por mês. Antes orc[cat] = valor; agora orc[cat] = { "AAAA-MM": valor } ("0000-01" = desde sempre).
  2: d => ({ config: { ...d.config, orc: Object.fromEntries(Object.entries(d.config.orc || {}).flatMap(([k, v]) => typeof v === "number" ? (v ? [[k, { "0000-01": v }]] : []) : [[k, v]])) }, lancamentos: d.lancamentos }),
};
const versaoDe = cfg => Number(cfg && cfg.versao) || 1;
function migrarDados(d) {
  let v = versaoDe(d.config), out = { config: d.config, lancamentos: d.lancamentos };
  while (v < VERSAO_DADOS) {
    const m = MIGRACOES[v + 1];
    if (typeof m !== "function") throw new Error(`Falta a migração dos dados para a versão ${v + 1}.`);
    out = m(structuredClone(out)); v++;
    out = { config: { ...out.config, versao: v }, lancamentos: out.lancamentos };
  }
  return out;
}
const ehObjeto = v => v !== null && typeof v === "object" && !Array.isArray(v);
function mesclarObj(a, b) { const o = ehObjeto(a) ? { ...a } : {}; for (const [k, v] of Object.entries(b || {})) o[k] = ehObjeto(v) && ehObjeto(o[k]) ? mesclarObj(o[k], v) : v; return o; }
const raizCaminho = () => `data/users/${S.uid}/livro`;
const lancCaminho = l => `${raizCaminho()}/l${l.comp.slice(0, 4)}/${l.id}`;
const dataHora = ms => new Date(ms).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
const tamTxt = b => b >= 1048576 ? (b / 1048576).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " MB" : Math.max(1, Math.round(b / 1024)) + " kB";
const plural = (n, um, varios) => `${n.toLocaleString("pt-BR")} ${n === 1 ? um : varios}`;

// lê tudo direto do armazenamento, sem depender do que está na tela
async function lerTudo() {
  if (S.db.todos) { // backend local: varre as chaves (pega também um ano que tenha ficado fora da lista)
    const base = raizCaminho(), pre = base + "/l";
    let config = null; const lancamentos = [];
    for (const [p, d] of S.db.todos()) {
      if (p === base) { config = d; continue; }
      if (!p.startsWith(pre)) continue;
      const resto = p.slice(pre.length), m = /^(\d{4})\/([^/]+)$/.exec(resto);
      if (m) lancamentos.push({ ...d, id: m[2] });
    }
    return { config, lancamentos };
  }
  const snap = await S.root.get(), config = snap.exists ? snap.data() : null;
  const anos = new Set([...(config?.anos || []), ...Object.keys(S.anos)]);
  const lancamentos = [];
  for (const y of anos) { const qs = await S.root.collection("l" + y).get(); for (const d of qs.docs) lancamentos.push({ ...d.data(), id: d.id }); }
  return { config, lancamentos };
}
// grava vários documentos: no backend local numa transação só (tudo ou nada); no claude.ai, um por vez
async function gravarLote(ops, progresso) {
  if (S.db.batch) return S.db.batch(ops);
  let i = 0;
  for (const o of ops) {
    const r = S.db.doc(o.path);
    await (o.data === null ? r.delete() : r.set(o.data));
    if (progresso && ++i % 20 === 0) progresso(i, ops.length);
  }
}
// grava uma base inteira { config, lancamentos }, já na VERSAO_DADOS. substituir: o que não estiver nela é apagado.
async function gravarBase(d, { substituir = true, progresso } = {}) {
  const atual = await lerTudo();
  const ops = [], novos = new Set(d.lancamentos.map(lancCaminho)), anos = new Set(d.lancamentos.map(l => l.comp.slice(0, 4)));
  // ordem pensada para o claude.ai, onde a gravação é um documento por vez: primeiro grava os lançamentos do backup,
  // depois apaga os que sobram e por último a configuração. Se parar no meio, nada some (no máximo sobra algo a apagar).
  const estavel = v => JSON.stringify(v, (k, x) => ehObjeto(x) ? Object.fromEntries(Object.keys(x).sort().map(c => [c, x[c]])) : x);
  const gravados = new Map(atual.lancamentos.map(l => [lancCaminho(l), estavel(l)]));
  for (const l of d.lancamentos) { const p = lancCaminho(l), dl = limpo(l); if (gravados.get(p) !== estavel({ ...dl, id: l.id })) ops.push({ path: p, data: dl }); } // o que já está igual não é regravado
  let cfg;
  if (substituir || !atual.config) {
    for (const l of atual.lancamentos) { const p = lancCaminho(l); if (!novos.has(p)) ops.push({ path: p, data: null }); }
    cfg = { ...d.config };
  } else {
    for (const y of atual.config.anos || []) anos.add(y);
    cfg = mesclarObj(atual.config, d.config);
  }
  cfg.anos = [...anos].sort(); cfg.versao = VERSAO_DADOS;
  ops.push({ path: raizCaminho(), data: cfg });
  await gravarLote(ops, progresso);
}
function montarBackup(d) {
  return { app: "fintrix", versao: versaoDe(d.config), app_versao: APP_VERSAO, exportado: new Date().toISOString(), config: d.config, lancamentos: d.lancamentos };
}
// confere o arquivo inteiro antes de gravar qualquer coisa
function validarBackup(j) {
  const erros = [];
  if (!ehObjeto(j) || !["fintrix", "livro-caixa"].includes(j.app)) return { erros: ["Esse arquivo não é um backup do FinTrix."] };
  if (!ehObjeto(j.config)) erros.push("Falta a configuração (contas, cartões e categorias).");
  if (!Array.isArray(j.lancamentos)) erros.push("Falta a lista de lançamentos.");
  if (erros.length) return { erros };
  const v = Number(j.config.versao || j.versao) || 1;
  if (v > VERSAO_DADOS) return { erros: [`Este backup foi feito por uma versão mais nova do FinTrix (dados v${v}; este app lê até a v${VERSAO_DADOS}). Atualize o app antes de restaurar.`] };
  for (const k of ["contas", "cartoes", "categorias", "tags", "recorr", "orc"]) if (j.config[k] != null && !ehObjeto(j.config[k])) erros.push(`A parte "${k}" da configuração está corrompida.`);
  const vistos = new Set();
  j.lancamentos.forEach((l, i) => {
    const p = [];
    if (!ehObjeto(l)) p.push("não é um lançamento");
    else {
      if (typeof l.id !== "string" || !l.id || l.id.includes("/") || l.id.length > 150) p.push("identificador inválido");
      else if (vistos.has(l.id)) p.push("identificador repetido"); else vistos.add(l.id);
      if (!["despesa", "receita", "transf"].includes(l.tipo)) p.push("tipo inválido");
      if (!Number.isInteger(l.valor)) p.push("valor inválido");
      if (!/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(l.data || "")) p.push("data inválida");
      if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(l.comp || "")) p.push("mês de referência inválido");
    }
    if (p.length) erros.push(`Lançamento ${i + 1}${ehObjeto(l) && l.desc ? ` (“${String(l.desc).slice(0, 40)}”)` : ""}: ${p.join(", ")}.`);
  });
  if (erros.length) return { erros };
  const comps = j.lancamentos.map(l => l.comp).sort(), n = o => Object.keys(o || {}).length;
  return { erros: [], versao: v, resumo: { n: j.lancamentos.length, de: comps[0], ate: comps[comps.length - 1], contas: n(j.config.contas), cartoes: n(j.config.cartoes), exportado: j.exportado || null } };
}

/* ---------- armazenamento do sistema, neste navegador: pasta do backup automático e cópias de segurança internas */
let _sis = null;
function sisDb() {
  if (!_sis) _sis = (async () => {
    if (!window.indexedDB) throw new Error("IndexedDB indisponível");
    const r = indexedDB.open("fintrix-sistema", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("copias", { keyPath: "id", autoIncrement: true }); };
    return idbReq(r);
  })();
  return _sis;
}
async function sisTx(store, modo, fn) {
  const db = await sisDb(), tx = db.transaction(store, modo);
  const fim = new Promise((ok, no) => { tx.oncomplete = ok; tx.onerror = () => no(tx.error); tx.onabort = () => no(tx.error); });
  const r = fn(tx.objectStore(store));
  await fim;
  return r instanceof IDBRequest ? r.result : r;
}
const sisGet = k => sisTx("kv", "readonly", st => st.get(k));
const sisSet = (k, v) => sisTx("kv", "readwrite", st => v === undefined ? st.delete(k) : st.put(v, k));
const COPIAS_MAX = 5;
const COPIAS = { n: 0, ult: null };
async function listarCopias() { // da mais nova para a mais velha, sem o conteúdo
  const todas = await sisTx("copias", "readonly", st => st.getAll());
  return todas.map(({ texto, ...c }) => ({ ...c, tam: texto.length })).sort((a, b) => b.quando - a.quando);
}
async function atualizarCopias() {
  try { const l = await listarCopias(); COPIAS.n = l.length; COPIAS.ult = l[0] || null; } catch { COPIAS.n = 0; COPIAS.ult = null; }
}
// guarda uma cópia dos dados atuais neste navegador antes de uma operação grande (restaurar, migrar, apagar tudo)
async function guardarCopia(motivo, dados) {
  if (!S.sisOk) return false;
  dados = dados || await lerTudo();
  if (!dados.config) return false;
  const texto = JSON.stringify(montarBackup(dados));
  await sisTx("copias", "readwrite", st => st.add({ quando: Date.now(), motivo, n: dados.lancamentos.length, texto }));
  const sobra = (await listarCopias()).slice(COPIAS_MAX);
  if (sobra.length) await sisTx("copias", "readwrite", st => { sobra.forEach(c => st.delete(c.id)); });
  await atualizarCopias();
  return true;
}
async function textoCopia(id) { const c = await sisTx("copias", "readonly", st => st.get(id)); return c ? c.texto : null; }

/* ---------- backup: data do último, aviso na Visão geral e backup automático numa pasta (Chrome/Edge no computador) */
const bkEstado = () => lsGet("backup", null);
function registrarBackup(via) { lsSet("backup", { ult: Date.now(), via }); }
function novosDesde(ms) { derivarSeNecessario(); return D.L.filter(l => (l.criado || 0) > ms).length; }
const pastaSuportada = () => S.modo === "local" && typeof window.showDirectoryPicker === "function";
const BK = { pasta: null, perm: null, ultTexto: null, timer: 0, gravando: false, erro: null };
const BK_MANTER = 15; // arquivos diários guardados na pasta
async function carregarPasta() {
  if (!pastaSuportada() || !S.sisOk) return;
  try { BK.pasta = (await sisGet("pastaBackup")) || null; } catch { BK.pasta = null; }
  if (BK.pasta) BK.perm = await BK.pasta.queryPermission({ mode: "readwrite" }).catch(() => "prompt");
}

  let h;
  try { h = await window.showDirectoryPicker({ id: "fintrix-backup", mode: "readwrite", startIn: "documents" }); }
  catch (e) { if (e && e.name !== "AbortError") { console.error(e); toast("Não foi possível usar essa pasta."); } return; }
  try { await sisSet("pastaBackup", h); } catch (e) { console.error(e); toast("Não foi possível lembrar essa pasta neste navegador."); return; }
  BK.pasta = h; BK.perm = "granted"; BK.ultTexto = null; BK.erro = null;
  await backupAuto(true); render();
  if (!BK.erro) toast("Backup automático ligado");

  if (!BK.pasta) return;
  try { BK.perm = await BK.pasta.requestPermission({ mode: "readwrite" }); } catch { BK.perm = "denied"; }
  if (BK.perm === "granted") { BK.erro = null; await backupAuto(true); }
  render();

/* ============================================================ camada de dados
   O app só conversa com o armazenamento por este contrato (o mesmo subconjunto do db do claude.ai):
     db.doc(caminho)            -> ref { get(), set(obj), update(obj), delete(), onSnapshot(fn, erro), collection(nome) }
     ref.collection(nome)       -> col { doc(id), get(), onSnapshot(fn, erro) }
     snapshot de documento      -> { id, exists, data() }      snapshot de coleção -> { docs: [snapshot] }
     onSnapshot devolve a função que cancela a inscrição. update exige o documento existente e mescla
     objetos aninhados; arrays e demais valores substituem o campo inteiro.
     downloads: { save({ filename, data }) }
   Opcionais (só o backend local tem; o app usa se existirem):
     db.batch([{ path, data }])  -> grava vários documentos numa transação só (data null = apagar)
     db.todos()                  -> [[caminho, dados], ...] de tudo o que está guardado (somente leitura)
   Para outro armazenamento (PocketBase, Supabase…), basta escrever mais um backend que cumpra esse contrato.
   Regra para funcionalidades novas: nunca chamar window.claude fora deste bloco. */
const Backends = {
  async claude() {
    const cl = window.claude;
    const [db, user, dl] = await Promise.all([cl.use("db"), cl.use("user"), cl.use("downloads")]);
    if (!db || !user) return { erro: "sem-db" };
    const uid = await user.id();
    if (!uid) return { erro: "sem-login" };
    return { modo: "claude", db, uid, dl };
  },
  async local() {
    return { modo: "local", db: await localDb("fintrix"), uid: "local", dl: downloadsNavegador() };
  },
};

/* ---------- backend local: IndexedDB, com cópia em memória e aviso entre abas abertas */
function idbReq(r) { return new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
function erroDb(e) {
  console.error(e);
  return Object.assign(new Error((e && e.message) || "Erro de armazenamento"), { code: e && e.name === "QuotaExceededError" ? "quota_exceeded" : e && e.code || "unavailable" });
}
async function localDb(nome) {
  if (!window.indexedDB) throw Object.assign(new Error("IndexedDB indisponível"), { code: "unavailable" });
  const abrir = indexedDB.open(nome, 1);
  abrir.onupgradeneeded = () => abrir.result.createObjectStore("docs");
  const idb = await idbReq(abrir);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  const cache = new Map();
  {
    const st = idb.transaction("docs").objectStore("docs");
    const [chaves, valores] = await Promise.all([idbReq(st.getAllKeys()), idbReq(st.getAll())]);
    chaves.forEach((k, i) => cache.set(k, valores[i]));
  }
  const clone = v => v === undefined ? undefined : structuredClone(v);
  const ehObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
  const mesclar = (a, b) => { const o = ehObj(a) ? { ...a } : {}; for (const [k, v] of Object.entries(b)) o[k] = ehObj(v) && ehObj(o[k]) ? mesclar(o[k], v) : clone(v); return o; };
  const pai = p => p.slice(0, p.lastIndexOf("/"));
  const ultimo = p => p.slice(p.lastIndexOf("/") + 1);
  const snapDoc = p => { const d = cache.get(p); return { id: ultimo(p), exists: d !== undefined, data: () => clone(d), metadata: {} }; };
  const snapCol = c => {
    const docs = [];
    for (const k of cache.keys()) if (pai(k) === c) docs.push(snapDoc(k));
    docs.sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    return { docs, size: docs.length, empty: !docs.length, docChanges: () => [] };
  };
  const subsDoc = new Map(), subsCol = new Map();
  const chamar = cb => { try { cb(); } catch (e) { console.error(e); } };
  function inscrever(mapa, p, cb) {
    let s = mapa.get(p); if (!s) mapa.set(p, s = new Set());
    s.add(cb); queueMicrotask(() => s.has(cb) && chamar(cb));
    return () => s.delete(cb);
  }
  function avisar(p) { subsDoc.get(p)?.forEach(chamar); subsCol.get(pai(p))?.forEach(chamar); }
  const canal = "BroadcastChannel" in window ? new BroadcastChannel("fintrix-" + nome) : null;
  if (canal) canal.onmessage = ev => {
    const m = ev.data || {};
    if (Array.isArray(m.lote)) { aplicarLote(m.lote); return; }
    if (typeof m.path !== "string") return;
    if (m.data === null) cache.delete(m.path); else cache.set(m.path, m.data);
    avisar(m.path);
  };
  let fila = Promise.resolve();
  const enfileirar = fn => { const p = fila.then(fn); fila = p.catch(() => {}); return p; };
  async function gravar(p, data) {
    try {
      const tx = idb.transaction("docs", "readwrite");
      const st = tx.objectStore("docs");
      if (data === null) st.delete(p); else st.put(data, p);
      await new Promise((ok, no) => { tx.oncomplete = ok; tx.onerror = () => no(tx.error); tx.onabort = () => no(tx.error); });
    } catch (e) { throw erroDb(e); }
    if (data === null) cache.delete(p); else cache.set(p, data);
    avisar(p);
    try { canal && canal.postMessage({ path: p, data }); } catch {}
  }
  // vários documentos numa transação só: ou grava tudo, ou nada
  function aplicarLote(ops) {
    const docs = new Set(), cols = new Set();
    for (const o of ops) { if (o.data === null) cache.delete(o.path); else cache.set(o.path, o.data); docs.add(o.path); cols.add(pai(o.path)); }
    docs.forEach(p => subsDoc.get(p)?.forEach(chamar)); cols.forEach(c => subsCol.get(c)?.forEach(chamar));
  }
  function lote(ops) {
    return enfileirar(async () => {
      const lim = ops.map(o => ({ path: o.path, data: o.data === null ? null : clone(o.data) }));
      try {
        const tx = idb.transaction("docs", "readwrite"), st = tx.objectStore("docs");

function faturaDe(card, ds) {
  const [y, m, d] = ds.split("-").map(Number);
  const f = Math.min(card.fech, dim(y, m)); // fechamento no dia 31 cai no último dia dos meses mais curtos
  let t = y * 12 + m - 1;
  if (card.fechAtual ? d > f : d >= f) t++; // fechAtual: a compra do próprio dia do fechamento ainda entra na fatura que fecha
  if (!(card.venc > card.fech)) t++;

}

const vencDe = (card, F) => diaEm(F, card.venc);
const fechDe = (card, F) => diaEm(card.venc > card.fech ? F : madd(F, -1), card.fech);

let D = null; // cache derivado por render
function derivar() {
  const L = [];

  const mat = new Set();
  for (const l of L) if (l.recorr && l.recM) mat.add(l.recorr + "|" + l.recM);

}

  const out = [];
  for (const [id, r] of Object.entries(C().recorr || {})) {
    if (r.arq) continue;
    const a = r.inicio > de ? r.inicio : de;
    const b = r.fim && r.fim < ate ? r.fim : ate;
    if (a > b) continue;
    const cada = r.cada || 1, est = r.varia ? mediaFixa(id) : null;
    for (let k = a; k <= b; k = madd(k, 1)) {
      if (cada > 1 && (k2t(k) - k2t(r.inicio)) % cada) continue;
      if ((r.pulos || []).includes(k) || D.mat.has(id + "|" + k)) continue;
      const data = diaEm(k, r.dia || 1);
      let comp = k;
      if (r.cartao) { const c = C().cartoes?.[r.cartao]; if (!c) continue; comp = faturaDe(c, data); }
      out.push({ id: `v_${id}_${k}`, virtual: true, recorr: id, recM: k, tipo: r.tipo, desc: r.desc, valor: est ?? r.valor, estimado: est != null, data, comp,
        conta: r.conta || null, cartao: r.cartao || null, cat: r.cat || null, tags: r.tags || [], pago: false, obs: "" });
    }
  }
  D.vcache[key] = out;

}
// fixa de valor variável: média dos 3 últimos registros (null se ainda não há)
function mediaFixa(id) {

}
const itensMes = M => D.L.filter(l => l.comp === M).concat(virtuais(madd(M, -1), M).filter(v => v.comp === M));
function totais(items) {
  let rec = 0, desp = 0;
  for (const l of items) { if (l.ajuste) continue; if (l.tipo === "receita") rec += l.valor; else if (l.tipo === "despesa") desp += l.valor; }
  return { rec, desp };
}
function fatura(cid, F) {
  const c = C().cartoes[cid];
  const itens = D.L.filter(l => l.cartao === cid && l.comp === F).concat(virtuais(madd(F, -1), F).filter(v => v.cartao === cid && v.comp === F));
  itens.sort((a, b) => a.data.localeCompare(b.data));
  const total = sum(itens);
  const pags = D.L.filter(l => l.tipo === "transf" && l.destino === cid && l.fatPag === F);
  const pago = sum(pags.filter(p => p.pago));
  const agendado = sum(pags);
  const venc = vencDe(c, F), fech = fechDe(c, F), h = today();
  let status;
  if (!itens.length && !pags.length) status = "vazia";
  else if (total <= 0 || pago >= total) status = "paga";
  else if (h < fech) status = "aberta";
  else if (h > venc) status = "vencida";

  return { itens, total, pago, agendado, restante: Math.max(0, total - pago), venc, fech, status, pags };
}
const STATUS_FAT = { vazia: ["mute", "Sem lançamentos"], paga: ["ok", "Paga"], aberta: ["info", "Aberta"], fechada: ["wait", "Fechada"], vencida: ["late", "Vencida"] };

}

}

}

  const V = virtuais("0000-01", M);

    for (const v of V) if (v.cartao === kid && v.comp <= M) tot[v.comp] = (tot[v.comp] || 0) + v.valor;

/* ---------- previsão por categoria

   3 gastos variáveis no mês (uma compra grande isolada distorce o ritmo), usa o típico dos 3 meses anteriores para o resto do mês.

function chart6(d, { anual = false } = {}) {
  const hojeM = mk(today());
  const W = 640, H = 230, L = 64, R = 12, T = 16, B = 30;
  const max = Math.max(10000, ...d.map(x => Math.max(x.rec, x.desp))); // mínimo R$ 100 evita eixo "R$ 0 / R$ 0" sem dados
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - R) / d.length, bw = Math.min(26, gw / 3.2);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${compact(v)}</text>`;
  d.forEach((x, i) => {
    const cx = L + gw * i + gw / 2;
    const bar = (v, dx, col, nm) => { const h = Math.max(0, y(0) - y(Math.max(0, v))); return `<g><title>${nm} ${mesLongo(x.m)}: ${fmt(v)}</title><rect x="${cx + dx}" y="${y(0) - h}" width="${bw}" height="${h}" rx="4" fill="${col}"/>${h > 2 ? `<rect x="${cx + dx}" y="${y(0) - Math.min(h, 4)}" width="${bw}" height="${Math.min(h, 4)}" fill="${col}"/>` : ""}</g>`; };
    const prev = anual && x.m > hojeM;
    g += `<g${prev ? ' opacity=".38"' : ""}>` + bar(x.rec, -bw - 1, "var(--pos)", prev ? "Receitas previstas" : "Receitas") + bar(x.desp, 1, "var(--neg)", prev ? "Despesas previstas" : "Despesas") + "</g>";
    const sel = !anual && x.m === S.mes;
    g += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="11.5" fill="${sel ? "var(--fg)" : "var(--muted)"}" font-weight="${sel ? 600 : 400}">${anual ? MESES[Number(x.m.slice(5)) - 1].slice(0, 3) : mesCurto(x.m)}</text>`;
    if (sel) g += `<rect class="mes-sel" x="${cx - 19}" y="${H - 5}" width="38" height="2.5" rx="1.25" fill="var(--accent)"><title>Mês selecionado</title></rect>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${anual ? `Receitas e despesas de ${d[0].m.slice(0, 4)}, mês a mês` : "Receitas e despesas dos últimos seis meses"}">${g}</svg></div>`;
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1)))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

/* ---------- orçamento */
/* ---------- orçamento com histórico por mês
   config.orc[cat] = { "AAAA-MM": limite, ... }: cada valor vale daquele mês em diante, até a próxima mudança ("0000-01" = desde sempre).
   Mudar um limite "deste mês em diante" grava a vigência no mês e apaga as mudanças marcadas para depois; "só neste mês" grava no mês e
   devolve o valor anterior no mês seguinte. Os meses passados nunca mudam. */
const ORC_SEMPRE = "0000-01";
function limiteEm(cat, M) {
  const h = (C().orc || {})[cat];
  if (!h) return 0;
  if (typeof h === "number") return h; // formato antigo (só aparece antes da migração)
  let k = null;
  for (const x in h) if (x <= M && (k === null || x > k)) k = x;
  return k === null ? 0 : h[k] || 0;
}
const temOrcamento = () => Object.values(C().orc || {}).some(h => typeof h === "number" ? h > 0 : Object.values(h || {}).some(v => v > 0));
// tira vigências que repetem o valor que já valia (e o "sem limite" do começo)
function compactarVig(h) {
  const o = {}; let ant = 0;
  for (const k of Object.keys(h).sort()) if (h[k] !== ant) { o[k] = h[k]; ant = h[k]; }
  return o;
}
async function salvarOrc(el) {
  const id = el.dataset.orc, M = el.dataset.mes || S.mes, v = moneyVal(el);

/* ============================================================ patrimônio e metas
   Patrimônio = saldo das contas que guardam dinheiro (poupança, carteira, benefícios, outras e investimentos, inclusive as fora do
   saldo geral). Contas correntes e cartões não entram: são dinheiro de passagem e gastos do dia a dia. O valor de um investimento é atualizado em
   Contas › Atualizar valor: a diferença vira um lançamento de rendimento (ajuste + rend), que entra no patrimônio e não nos relatórios. */
const ehInvest = id => C().contas?.[id]?.tipo === "investimento";
const entraPatr = id => C().contas?.[id]?.tipo !== "corrente"; // conta corrente fica fora do patrimônio
// saldo de uma conta até o fim de um dia (lançamentos pagos com data até ele)
function saldoAte(cid, ds) {
  let s = C().contas?.[cid]?.inicial || 0;
  for (const l of D.L) if (l.pago && l.data <= ds) s += efeito(l, cid);
  return s;
}
// séries mês a mês (fim de cada mês; o mês atual usa o saldo de hoje), numa passada só pelos lançamentos
function seriePatrimonio(meses) {
  const Mh = mk(today()), cs = Object.keys(C().contas || {}), ks = Object.keys(C().cartoes || {});
  const dC = Object.fromEntries(cs.map(id => [id, {}])), dK = Object.fromEntries(ks.map(id => [id, {}]));
  const fluxo = {}; // por mês: rendimento e aportes em investimentos
  const add = (o, m, v) => { o[m] = (o[m] || 0) + v; };
  for (const l of D.L) {
    const m = l.data.slice(0, 7);
    if (l.cartao && l.tipo === "despesa") { if (dK[l.cartao]) add(dK[l.cartao], m, l.valor); continue; }
    if (!l.pago) continue;
    for (const id of [l.conta, l.destino]) if (id && dC[id]) { const e = efeito(l, id); if (e) add(dC[id], m, e); }
    if (l.tipo === "transf" && dK[l.destino]) add(dK[l.destino], m, -l.valor);
    const f = fluxo[m] = fluxo[m] || { rend: 0, aporte: 0 };
    if (l.rend) f.rend += l.tipo === "receita" ? l.valor : -l.valor;
    else for (const id of [l.conta, l.destino]) if (id && ehInvest(id)) f.aporte += efeito(l, id);
  }
  // acumulado até o início da série
  const ini = meses[0], acum = (o, base = 0) => { let s = base; for (const m in o) if (m < ini) s += o[m]; return s; };
  const sC = Object.fromEntries(cs.map(id => [id, acum(dC[id], C().contas[id].inicial || 0)])), sK = Object.fromEntries(ks.map(id => [id, acum(dK[id])]));
  return meses.map(m => {
    for (const id of cs) sC[id] += dC[id][m] || 0;
    for (const id of ks) sK[id] += dK[id][m] || 0;
    const hoje = m === Mh;
    const porConta = Object.fromEntries(cs.map(id => [id, hoje ? saldoAtual(id) : sC[id]]));
    const contasV = sum(cs.filter(id => !ehInvest(id) && entraPatr(id)), id => porConta[id]), inv = sum(cs.filter(ehInvest), id => porConta[id]);
    return { m, contas: contasV, inv, liq: contasV + inv, porConta, rend: fluxo[m]?.rend || 0, aporte: fluxo[m]?.aporte || 0 };
  });
}
function mesesPatr() {
  const Mh = mk(today()), per = lsGet("patrPer", "12");
  let ini = Mh;
  for (const l of D.L) if (l.data.slice(0, 7) < ini) ini = l.data.slice(0, 7);
  const n = per === "tudo" ? k2t(Mh) - k2t(ini) + 1 : Number(per);
  return Array.from({ length: Math.max(2, n) }, (_, i) => madd(Mh, i - Math.max(2, n) + 1));
}
function chartPatr(s) {

  const W = Math.max(320, Math.min(1100, (($("#content")?.clientWidth || 700) - 72))), H = W < 520 ? 200 : 250, L = 78, R = 26, T = 14, B = 30;
  const vals = s.flatMap(x => [x.liq, x.inv]);
  let lo = Math.min(0, ...vals), hi = Math.max(10000, ...vals);
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo || 1)), x = i => L + (W - L - R) * (s.length === 1 ? .5 : i / (s.length - 1));
  let g = "";
  for (let v = lo; v <= hi + 1; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"${v === 0 && lo < 0 ? ' stroke-width="1.6"' : ""}/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v < 0 ? "−" : ""}${compact(Math.abs(v))}</text>`;
  const pts = k => s.map((p, i) => `${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(" ");
  g += `<polygon points="${x(0)},${y(Math.max(lo, 0))} ${pts("liq")} ${x(s.length - 1)},${y(Math.max(lo, 0))}" fill="var(--accent)" opacity=".10"/>`;
  if (s.some(p => p.inv)) g += `<polyline points="${pts("inv")}" fill="none" stroke="var(--pos)" stroke-width="2" stroke-dasharray="5 4"/>`;
  g += `<polyline points="${pts("liq")}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>`;
  const cada = Math.ceil(s.length / Math.max(3, Math.floor((W - L - R) / 62)));
  s.forEach((p, i) => {
    g += `<g><title>${mesLongo(p.m)}: patrimônio ${fmt(p.liq)}${p.inv ? ` · investido ${fmt(p.inv)}` : ""}</title><circle cx="${x(i)}" cy="${y(p.liq)}" r="${s.length > 36 ? 2 : 3.5}" fill="var(--accent)"/><rect x="${x(i) - 8}" y="${T}" width="16" height="${H - T - B}" fill="transparent"/></g>`;
    if ((s.length - 1 - i) % cada === 0) g += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${mesCurto(p.m)}</text>`;
  });

    <div class="leg"><span><i style="background:var(--accent)"></i>Patrimônio</span>${s.some(p => p.inv) ? '<span><i class="tr" style="border-color:var(--pos)"></i>Investido</span>' : ""}</div>`;
}

/* ---------- metas: valor-alvo, data opcional e as contas que contam para ela */
const metaContas = m => (m.contas || []).filter(id => C().contas?.[id]);
function progressoMeta(m) {
  const ids = metaContas(m), atual = sum(ids, id => saldoAtual(id)), Mh = mk(today());
  const tres = madd(Mh, -3), fim3 = diaEm(tres, 31), antes = sum(ids, id => saldoAte(id, fim3)), ritmo = Math.round((atual - antes) / 3);
  const falta = Math.max(0, m.alvo - atual), pct = m.alvo ? Math.max(0, atual / m.alvo) : 0;
  const restam = m.data ? k2t(m.data) - k2t(Mh) + 1 : null;
  return { atual, falta, pct, ritmo, restam, porMes: restam > 0 ? Math.ceil(falta / restam) : null, chega: ritmo > 0 && falta ? madd(Mh, Math.ceil(falta / ritmo)) : null };

/* ---------- atualizar o valor de um investimento (vira rendimento) */

async function reduzirImagem(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || !window.createImageBitmap) return file;
  try {
    const bmp = await createImageBitmap(file), lado = Math.max(bmp.width, bmp.height);
    if (file.size < 400 * 1024 && lado <= 2000) { bmp.close?.(); return file; }
    const k = Math.min(1, 2000 / lado), cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close?.();
    const b = await new Promise(r => cv.toBlob(r, "image/jpeg", .82));
    return b && b.size < file.size ? b : file;
  } catch { return file; }
}

  if (!S.dl) { msgDados("Este visualizador não permite baixar arquivos."); return false; }
  try { await S.dl.save({ filename: nome, data }); msgDados("Arquivo pronto: " + nome); return true; }
  catch (e) { msgDados(e && e.code === "declined" ? "Download cancelado." : "Não foi possível gerar o arquivo agora."); return false; }
}
function exportCSV() {
  derivarSeNecessario();
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const num = c => (c / 100).toFixed(2).replace(".", ",");
  const linhas = [["Data", "Mês de referência", "Tipo", "Descrição", "Categoria", "Subcategoria", "Conta", "Cartão", "Destino", "Valor", "Situação", "Parcela", "Fixa", "Tags", "Observação", "Divisão"].join(";")];
  const L = [...D.L].sort((a, b) => a.data.localeCompare(b.data));
  for (const l of L) {
    const ps = partes(l);
    ps.forEach((pt, i) => {
      const c = cats()[pt.cat], pai = c ? (c.pai ? cats()[c.pai]?.nome : c.nome) : l.rend ? "Rendimento" : l.ajuste ? (l.cartao ? "Ajuste de fatura" : "Ajuste de saldo") : "";
      const tipo = l.tipo === "transf" ? (l.fatPag ? "Pagamento de fatura" : "Transferência") : l.cartao ? "Despesa no cartão" : l.tipo === "receita" ? "Receita" : "Despesa";
      linhas.push([l.data.split("-").reverse().join("/"), l.comp, tipo, q(l.desc), q(pai), q(c && c.pai ? c.nome : ""), q(l.conta ? nomeConta(l.conta) : ""), q(l.cartao ? nomeConta(l.cartao) : ""), q(l.destino ? nomeConta(l.destino) : ""),
        num(l.tipo === "receita" ? pt.valor : -pt.valor), l.pago ? "Pago" : "Pendente", l.parc ? `${l.parc.i}/${l.parc.n}` : "", l.recorr ? "Sim" : "", q((l.tags || []).map(t => C().tags?.[t]?.nome).filter(Boolean).join(", ")), q(l.obs),
        ps.length > 1 ? q(`parte ${i + 1} de ${ps.length} (total ${num(l.valor)})`) : ""].join(";"));
    });
  }
  salvarArquivo(`fintrix-${today()}.csv`, "﻿" + linhas.join("\r\n"));
}
// backup em arquivo: lê direto do armazenamento (o que está gravado, não o que está na tela)
async function exportJSON() {
  try {
    const dados = await lerTudo();
    if (!dados.config) { msgDados("Não há dados para salvar."); return; }
    const nome = `fintrix-backup-${today()}.json`;
    if (await salvarArquivo(nome, JSON.stringify(montarBackup(dados), null, 1))) { registrarBackup("manual"); render(); msgDados("Backup pronto: " + nome); }
  } catch (e) { console.error(e); msgDados("Não foi possível gerar o backup agora."); }
}
function pedirApagarTudo() {

      <div class="f"><label for="ap-c">Digite APAGAR para confirmar</label><input class="inp" id="ap-c" autocomplete="off"></div><div class="err" id="m-err"></div></form>

async function apagarTudo() {
  if ($("#ap-c").value.trim().toUpperCase() !== "APAGAR") { $("#m-err").textContent = "Digite APAGAR."; return; }
  const err = $("#m-err"), btns = $$("#layer .mfoot .btn"); err.style.color = "var(--muted)"; btns.forEach(b => b.disabled = true);
  try {
    const dados = await lerTudo();
    if (dados.config) { err.textContent = "Guardando uma cópia…"; await guardarCopia("Antes de apagar todos os dados", dados); }
    err.textContent = "Apagando…";
    const ops = dados.lancamentos.map(l => ({ path: lancCaminho(l), data: null }));
    ops.push({ path: raizCaminho(), data: null });
    await gravarLote(ops, (i, n) => { err.textContent = `Apagando… ${i} de ${n}`; });
    for (const y in S.subs) { S.subs[y](); delete S.subs[y]; } S.anos = {};
    await anexosLimpar();
    lsSet("backup", null);
    fecharJanela(); toast("Dados apagados");
  } catch (e) { console.error(e); err.style.color = ""; err.textContent = "Não foi possível apagar tudo agora. Nada foi apagado" + (S.db.batch ? "." : " ou só uma parte; tente de novo."); btns.forEach(b => b.disabled = false); }
}

  "m-pular": async () => { const e = MS.edit, r = C().recorr[e.recorr], antes = { id: e.recorr, pulos: [...(r.pulos || [])], fim: r.fim || null };
    try { await cfgWrite({ recorr: { [e.recorr]: { pulos: [...antes.pulos, e.recM] } } }); fecharJanela(); toast(`${mesLongo(e.recM)} pulado`, { rotulo: "Desfazer", fn: () => desfazerExclusao([], antes) }); } catch (ex) { falha(ex); } },
  "m-encerrar": async () => { const e = MS.edit, r = C().recorr[e.recorr], antes = { id: e.recorr, pulos: [...(r.pulos || [])], fim: r.fim || null };
    try { await cfgWrite({ recorr: { [e.recorr]: { fim: madd(e.recM, -1) } } }); fecharJanela(); toast("Fixa encerrada", { rotulo: "Desfazer", fn: () => desfazerExclusao([], antes) }); } catch (ex) { falha(ex); } },
};
document.addEventListener("click", ev => {
  const onb = $("#onb.anim:not(.pular)"); if (onb && !ev.target.closest("button")) onb.classList.add("pular");
  const el = ev.target.closest("[data-act]");
  if (!el) { if (!ev.target.closest("#menu")) fecharMenu(); return; }
  if (el.closest("#menu") && !["novo-menu", "mp-ano", "mes-picker", "dp-mes"].includes(el.dataset.act)) fecharMenu();
  const fn = A[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener("input", ev => {
  const dv = ev.target.dataset?.divV; if (dv != null && MS?.divs?.[dv]) { MS.divs[dv].valor = Math.abs(moneyVal(ev.target)); atualizarDivHint(); atualizarAlerta(); }
  if (ev.target.id === "f-q") { S.f.q = ev.target.value; clearTimeout(A._qt); A._qt = setTimeout(() => { const pos = ev.target.selectionStart; render(); const q = $("#f-q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }, 180); }
});
document.addEventListener("change", ev => {
  const id = ev.target.id;
  const dc = ev.target.dataset?.divCat; if (dc != null && MS?.divs?.[dc]) { MS.divs[dc].cat = ev.target.value; atualizarDivHint(); atualizarAlerta(); return; }
  if (id === "m-cada" || id === "m-varia") { atualizarRepHint(); return; }
  if (/^f-(conta|cat|tag|status|per|de|ate)$/.test(id)) S.f.lim = 300;
  if (id === "f-per") { S.f.per = ev.target.value; if (S.f.per === "pers" && !S.f.de) { S.f.de = madd(S.mes, -2); S.f.ate = S.mes; } render(); }
  else if (id === "f-de" || id === "f-ate") { if (/^\d{4}-\d{2}$/.test(ev.target.value)) { S.f[id.slice(2)] = ev.target.value; render(); } }
  else if (id === "f-conta") { S.f.conta = ev.target.value; render(); }
  else if (id === "f-cat") { S.f.cat = ev.target.value; render(); }
  else if (id === "f-tag") { S.f.tag = ev.target.value; render(); }
  else if (id === "f-status") { S.f.status = ev.target.value; render(); }
  else if (id === "imp-json" && ev.target.files[0]) importJSON(ev.target.files[0]);
  else if (id === "imp-zip" && ev.target.files[0]) importarAnexosZip(ev.target.files[0]);
  else if (ev.target.dataset.orc) salvarOrc(ev.target);
});
// salvarOrc: ver o bloco do orçamento com histórico
let toqueT = 0, toqueXY = null;
document.addEventListener("pointerdown", ev => {
  const g = ev.target.closest?.('.row .grow[data-act="abrir"]');
  if (!g || S.view !== "lanc" || S.selModo || g.dataset.id.startsWith("v_") || ev.button > 0) return;
  toqueXY = [ev.clientX, ev.clientY];
  toqueT = setTimeout(() => { toqueT = 0; S._toqueLongo = true; selEntrar(g.dataset.id); navigator.vibrate?.(15); setTimeout(() => { S._toqueLongo = false; }, 700); }, 520);
});
const cancelaToque = ev => { if (!toqueT) return; if (ev.type === "pointermove" && toqueXY && Math.hypot(ev.clientX - toqueXY[0], ev.clientY - toqueXY[1]) < 8) return; clearTimeout(toqueT); toqueT = 0; };
["pointerup", "pointercancel", "pointermove"].forEach(t => document.addEventListener(t, cancelaToque));
document.addEventListener("contextmenu", ev => { if (S._toqueLongo || (S.selModo && ev.target.closest?.(".selrow"))) ev.preventDefault(); });
document.addEventListener("scroll", ev => { if ($("#menu.dpick") && !ev.target.closest?.("#menu")) fecharMenu(); }, true);
document.addEventListener("focusin", ev => { if (ev.target.matches("[data-money]")) ligarMoney(ev.target.parentElement || document); });
document.addEventListener("keydown", ev => {
  $("#onb.anim:not(.pular)")?.classList.add("pular");
  if (ev.key === "Escape" && $("#menu.dpick")) { ev.preventDefault(); const id = DP?.id; fecharMenu(); $("#" + id + "-txt")?.focus(); return; }
  if (janelaAberta()) {
    if (ev.key === "Escape") { ev.preventDefault(); fecharJanela(); return; }
    if (ev.key === "Enter" && ev.target.dataset?.expr === "1") return;
    if (ev.key === "Enter" && ev.target.tagName !== "TEXTAREA" && ev.target.tagName !== "BUTTON" && $("#f-lanc") && ev.target.id !== "m-tagnova") {
      ev.preventDefault(); salvarLanc(ev.shiftKey && !MS.edit); return;
    }
    if (ev.key === "Enter" && ev.target.id === "m-tagnova") { ev.preventDefault(); A["m-tag-add"](); return; }
    if (ev.key === "Enter" && !$("#f-lanc") && /INPUT|SELECT/.test(ev.target.tagName) && ev.target.type !== "checkbox") {
      const b = $('.mfoot [data-act$="salvar"], .mfoot [data-act="apagar-confirma"]'); if (b) { ev.preventDefault(); b.click(); }
    }
    return;
  }
  if (ev.key === "Escape") { if (S.selModo && !$("#menu")) { sairSelecao(); return; } fecharMenu(); }
  if (S.selModo && S.view === "lanc") {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "a" && !/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) { ev.preventDefault(); (S._todos || []).forEach(id => S.sel.add(id)); render(); return; }
    if ((ev.key === " " || ev.key === "Enter") && ev.target.dataset?.act === "sel-row") { ev.preventDefault(); selAlternar(ev.target.dataset.id, ev); return; }
  }
  if (ev.target.dataset && ev.target.dataset.orc && ev.key === "Enter") { ev.target.blur(); return; }
  if (S.fase !== "pronto" || ev.ctrlKey || ev.metaKey || ev.altKey || /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
  const k = ev.key.toLowerCase();
  const map = { d: "despesa", r: "receita", c: "cartao", t: "transf" };
  if (map[k]) { ev.preventDefault(); abrirLanc({ tipo: map[k] }); }
  else if (ev.key === "ArrowLeft") { S.mes = madd(S.mes, anualRel() ? -12 : -1); render(); }
  else if (ev.key === "ArrowRight") { S.mes = madd(S.mes, anualRel() ? 12 : 1); render(); }
});
document.addEventListener("focusout", ev => { if (ev.target.dataset && ev.target.dataset.orc) salvarOrc(ev.target); });

document.addEventListener("dragover", ev => { if (S.fase === "pronto" && [...(ev.dataTransfer?.types || [])].includes("Files")) ev.preventDefault(); });
document.addEventListener("drop", ev => {
  const f = ev.dataTransfer?.files?.[0]; if (!f || S.fase !== "pronto") return;
  ev.preventDefault();
  if (ev.target.closest?.("#imp-drop")) return; // a área da própria janela trata
  if (/\.(ofx|qfx|csv|txt)$/i.test(f.name) && !janelaAberta()) abrirImportar(null, f);
  else if (!janelaAberta()) toast("Para importar, use um arquivo OFX ou CSV do banco.");
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") backupAuto(false); });

render();
boot().catch(e => { console.error(e); S.fase = "erro"; render(); });
</script>
</body>
</html>

[package]
name = "fintrix-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# SQLCipher compilado junto (usa o OpenSSL do sistema para a criptografia)
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
